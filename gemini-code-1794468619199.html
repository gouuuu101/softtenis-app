<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日高ソフ研">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#001F43">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>日南高校ソフトテニス研究</title>
<style>
:root{--navy:#001F43;--yel:#F4E511;--bg:#EDF1F7;--panel:#fff;--ink:#001F43;--sub:#4a5d78;--line:#cfd8e6;--track:#dfe6f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#001F43;--panel:#0a2d58;--ink:#fff;--sub:#a9b9d0;--line:#1d4276;--track:#04274f}}
:root[data-theme="dark"]{--bg:#001F43;--panel:#0a2d58;--ink:#fff;--sub:#a9b9d0;--line:#1d4276;--track:#04274f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header b{width:14px;height:34px;background:var(--yel);border-radius:3px;display:block}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.02em}
nav{display:flex;gap:6px;background:var(--navy);padding:5px;border-radius:12px;margin-bottom:14px}
nav button{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:700;padding:12px 4px;border-radius:8px;min-height:44px}
nav button[aria-selected="true"]{background:var(--yel);color:var(--navy)}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px;font-weight:800}
.row{display:grid;gap:8px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}
.cnt{border:2px solid var(--navy);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation}
.cnt span{font-size:14px;font-weight:700}.cnt em{font-style:normal;font-size:34px;font-weight:800;line-height:1.1}
.cnt.good{background:var(--yel);border-color:var(--yel);color:var(--navy)}
.cnt.bad{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cnt{border-color:var(--yel)}}
.cnt:active{transform:scale(.97)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:2px solid var(--navy);background:none;color:var(--ink);font:inherit;font-weight:700;border-radius:10px;padding:10px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--yel);border-color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button{border-color:var(--yel)}:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--yel);color:var(--navy)}}
.hint{font-size:13px;color:var(--sub);margin:0 0 8px;min-height:20px}
.court{background:var(--navy);border-radius:12px;padding:8px;max-width:420px;margin:0 auto}
.court svg{display:block;width:100%;height:auto;touch-action:manipulation}
.act{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:2px solid var(--navy);background:var(--navy);color:#fff;font:inherit;font-weight:700;border-radius:10px;padding:11px;min-height:44px}
.btn.ghost{background:none;color:var(--ink)}
.btn.danger{background:#b3261e;border-color:#b3261e}
.bar{margin:0 0 12px}
.bar .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
.bar .t strong{font-size:26px;font-weight:800}
.bar .t small{color:var(--sub);font-weight:400;margin-left:6px}
.trk{height:16px;background:var(--track);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.trk i{display:block;height:100%;background:var(--yel);border-right:3px solid var(--navy);transition:width .35s}
.trk i.ng{background:var(--navy);border-right:0}
.note{font-size:14px;margin:10px 0 0}
.leg{display:flex;gap:14px;font-size:12px;color:var(--sub);justify-content:center;margin-top:8px}
.leg span:before{content:"";display:inline-block;width:18px;height:0;border-top:3px solid var(--yel);vertical-align:middle;margin-right:5px}
.leg span.d:before{border-top:3px dashed var(--sub)}
.pill{display:inline-block;background:var(--navy);color:var(--yel);border-radius:6px;padding:0 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--navy);background:none;color:var(--ink);font:inherit;font-weight:700;border-radius:999px;padding:8px 14px;min-height:44px}
.chips button small{margin-left:6px;font-weight:400;opacity:.8}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--yel)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chips button{border-color:var(--yel)}:root:not([data-theme="light"]) .chips button[aria-pressed="true"]{background:var(--yel);color:var(--navy)}:root:not([data-theme="light"]) .inp{border-color:var(--yel)}}
.inp{flex:1;min-width:0;border:2px solid var(--navy);border-radius:10px;padding:10px;font:inherit;font-size:16px;background:var(--panel);color:var(--ink)}
.rost{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.rost button{border:0;background:none;color:#b3261e;font:inherit;font-weight:700;min-height:44px;padding:0 8px}
.ov{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
.cmp th,.cmp td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.btn small{display:block;font-weight:400;font-size:11px}
.leg span.r:before{border-top:3px dotted var(--yel)}
.leg span.p:before{border-top:3px dashed var(--yel)}
.leg span.m:before{border-top:3px dotted var(--sub)}
.sb{background:var(--navy);color:#fff;border-radius:12px;padding:14px;text-align:center}
.sb-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.sb-tm{font-size:14px;font-weight:800;color:var(--yel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-gm{font-size:44px;font-weight:800;line-height:1}
.sb-pt{font-size:28px;font-weight:800;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 4px;margin-top:8px}
.sb-mid{font-size:12px;color:#a9b9d0}
.sb-badge{display:inline-block;background:var(--yel);color:var(--navy);font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;margin-bottom:8px}
.mini-bar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px;font-weight:700}
.mini-bar strong{color:var(--yel);font-size:16px}
.ghist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ghist span{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
.ghist span.me{background:var(--yel);color:var(--navy);border-color:var(--yel)}
.ghist span.op{background:var(--navy);color:#fff;border-color:var(--navy)}
#pick,#lp{position:fixed;inset:0;background:rgba(0,31,67,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.pk{background:var(--panel);color:var(--ink);border-radius:14px;padding:14px;max-width:560px;width:100%;max-height:100%;overflow:auto}
@media (orientation:landscape) and (min-width:640px){
.wrap{max-width:1120px}
#in,#an{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);column-gap:14px;align-items:start}
#in>.card,#an>.card{grid-column:1}
#in>.card:nth-child(3){grid-column:2;grid-row:1/3}
#an>.card:nth-child(4){grid-column:2;grid-row:1/4}
.court{max-width:none}
.cnt{min-height:68px}
}
#report{display:none}
#report h1{font-size:20px;margin:0 0 4px;border-left:10px solid #F4E511;padding-left:8px}
#report h2{font-size:14px;margin:14px 0 6px}
.rmeta{font-size:12px;color:var(--sub);margin:0}
.rc{display:flex;flex-wrap:wrap;gap:10px}.rc>div{flex:0 0 calc(50% - 5px);min-width:0;break-inside:avoid}.rc .court{max-width:none}
.cap{font-weight:700;font-size:12px;margin-bottom:4px}
@page{margin:12mm}
@media print{
:root:not([data-theme="light"]),:root[data-theme="dark"],:root{--bg:#fff;--panel:#fff;--ink:#001F43;--sub:#4a5d78;--line:#cfd8e6;--track:#dfe6f0}
body{background:#fff}
.wrap{display:none}
#report{display:block;color:#001F43}
.court,.trk,.trk i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ov{overflow:visible}table.cmp{min-width:0}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><b></b><h1>日南高校ソフトテニス研究</h1></header>
<nav role="tablist">
<button role="tab" data-v="in" aria-selected="true">入力</button>
<button role="tab" data-v="an" aria-selected="false">分析</button>
<button role="tab" data-v="se" aria-selected="false">設定</button>
<button role="tab" data-v="pt" aria-selected="false">ポイント</button>
</nav>

<section id="in">
<div class="card"><h2>選手</h2><div class="seg" id="teamIn"><button data-t="me" aria-pressed="true">自チーム</button><button data-t="op" aria-pressed="false">相手チーム</button></div><div class="chips" id="chipsIn"></div></div>
<div class="card"><h2>プレー結果</h2>
<div class="mini-bar" id="miniScore"></div>
<div class="seg" id="srvIn"><button data-s="rx" aria-pressed="true">自チームがレシーブ</button><button data-s="sv" aria-pressed="false">自チームがサーブ</button></div>
<p class="hint" id="rxTargetHint"></p>
<div id="counters"></div><div class="act"><button class="btn ghost" id="undo">ひとつ戻す</button></div></div>
<div class="card" id="inCard"><h2>選手の得点・ミスコース</h2>
<div class="chips" id="opIn" style="margin-bottom:10px" hidden></div>
<div class="court" id="courtIn"></div>
<p class="note" id="pmInfo"></p>
<div class="leg"><span class="p">得点</span><span class="m">ミス</span></div>
</div>
</section>

<section id="an" hidden>
<div class="card"><h2>分析する選手</h2><div class="seg" id="teamAn"><button data-t="me" aria-pressed="true">自チーム</button><button data-t="op" aria-pressed="false">相手チーム</button></div><div class="chips" id="chipsAn"></div><h2 style="margin-top:14px">対戦した相手選手で絞り込み（自チームのコースのみ）</h2><div class="chips" id="chipsOp"></div><div class="act"><button class="btn" id="pdf">分析をPDFで保存</button></div></div>
<div class="card"><h2>確率</h2><div id="stats"></div></div>
<div class="card" id="cmpCard"><h2>選手別の比較</h2><div class="ov" id="cmp"></div></div>
<div class="card"><h2>コースの傾向</h2>
<div class="chips" id="chipsHd" style="margin-bottom:10px"></div>
<div class="seg" id="modeAn"><button data-m="pm" aria-pressed="true">得点＋ミス</button><button data-m="pt" aria-pressed="false">得点</button><button data-m="ms" aria-pressed="false">ミス</button></div>
<div class="court" id="courtAn"></div>
<div class="leg"><span class="p">得点</span><span class="m">ミス</span></div>
<p class="note" id="insight"></p>
</div>
</section>

<section id="se" hidden>
<div class="card"><h2>選手登録</h2>
<div class="seg" id="pr"><button data-r="前衛" aria-pressed="true">前衛</button><button data-r="後衛" aria-pressed="false">後衛</button></div>
<div class="act" style="margin:0 0 8px"><input class="inp" id="pn" placeholder="選手名" maxlength="12"><button class="btn" id="padd" style="flex:0 0 88px">追加</button></div>
<div id="roster"></div></div>
<div class="card"><h2>対戦相手</h2>
<input class="inp" id="on" placeholder="相手チーム名" maxlength="20" style="width:100%;margin-bottom:10px">
<div class="seg" id="or"><button data-r="前衛" aria-pressed="true">前衛</button><button data-r="後衛" aria-pressed="false">後衛</button></div>
<div class="act" style="margin:0 0 8px"><input class="inp" id="opn" placeholder="相手選手名" maxlength="12"><button class="btn" id="oadd" style="flex:0 0 88px">追加</button></div>
<div id="orost"></div></div>
<div class="card"><h2>データ管理</h2>
<p class="hint">入力データはこの端末のブラウザに自動保存され、オフラインでも使えます。消去しても選手登録は残ります。</p>
<div class="act"><button class="btn ghost" id="theme">表示：自動</button><button class="btn danger" id="reset">全データを消去</button></div>
</div>
<div class="card"><h2>用語</h2>
<p class="note"><span class="pill">得点</span> ポイントになったプレー（押すとコースとフォア／バックを選べます）<br><span class="pill">ミス・失敗</span> 失点。押すと「アウト／ネット」とコースを選べます（レシーブ失敗は種類のみ）
